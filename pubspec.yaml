name: expense_tracker
description: A personal expense tracker demonstrating modern Flutter development
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0
  drift: ^2.25.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0
  go_router: ^15.1.0
  fl_chart: ^0.70.0
  intl: ^0.20.0
  shared_preferences: ^2.3.0
  uuid: ^4.5.0
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^3.0.0
  build_runner: ^2.4.0
  drift_dev: ^2.25.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
